button{font-family:inherit}
.wrap{max-width:720px;margin:0 auto}

.topbar{

.topbar.scrolled{border-bottom-color:var(--border)}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{

  background:linear-gradient(155deg,var(--primary),var(--primary-ink));

.brand .name{font-family:var(--font-head);font-weight:700;font-size:14.5px}

.step-pill{

}

.section-label{margin-top:8px;font-size:12.5px;color:var(--primary-ink);font-weight:700}

textarea{min-height:96px; resize:vertical}
input[type=text]:focus, textarea:focus{outline:2px solid var(--primary); outline-offset:1px}
.hint{font-size:12px;color:var(--text-muted); margin-top:8px}

.err{

.btn-primary{background:var(--primary); color:#fff; flex:1}

.info-row .v{font-size:13.5px; color:var(--text-muted)}

.rev-item{border-bottom:1px solid var(--border); padding:13px 0}

.rev-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.rev-q{font-weight:700; font-size:13.5px; flex:1}
.rev-ans{font-size:14px; color:var(--text-muted); margin-top:5px}
.rev-ans.empty{color:var(--border); font-style:italic}

pre.data-preview{

@media (min-width:560px){

/* ---------------------------------------------------------------------
   الحالة العامة
--------------------------------------------------------------------- */
var answers = {};        // varName -> value
var otherTexts = {};     // varName -> نص التوضيح لخيار "أخرى"
var screen = "intro";    // intro | question | declined | review | done
var qIndex = 0;
var lastError = "";
var submitState = "idle";  // idle | sending | sent | failed
var hasSubmitted = false;

function submitResponse(obj){
  if(hasSubmitted) return;
  hasSubmitted = true;
  if(!SUBMIT_URL){ submitState = "failed"; render(); return; }
  submitState = "sending"; render();
  fetch(SUBMIT_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {"Content-Type": "text/plain;charset=utf-8"},
    body: JSON.stringify(obj)
  }).then(function(){
    submitState = "sent"; render();
  }).catch(function(){
    submitState = "failed"; render();
  });
}

function applicable(q){ return q.showIf(answers); }
function applicableList(){ return Q.filter(applicable); }

function firstApplicableFrom(i, dir){
  while(i>=0 && i<Q.length){
    if(applicable(Q[i])) return i;
    i += dir;
  }
  return dir>0 ? Q.length : -1;
}

/* ---------------------------------------------------------------------
   أدوات مساعدة للعرض
--------------------------------------------------------------------- */
function el(tag, attrs, children){
  var e = document.createElement(tag);
  attrs = attrs || {};
  for(var k in attrs){
    if(k==="class") e.className = attrs[k];
    else if(k==="html") e.innerHTML = attrs[k];
    else if(k.indexOf("on")===0) e.addEventListener(k.slice(2), attrs[k]);
    else e.setAttribute(k, attrs[k]);
  }
  (children||[]).forEach(function(c){ if(c) e.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return e;
}

function labelFor(list, code){
  for(var i=0;i<list.length;i++) if(list[i].code===code) return list[i].label;
  return code;
}

function optionListForQuestion(q){
  if(q.poolFrom){
    var picked = answers[q.poolFrom] || [];
    return picked.map(function(code){
      var lbl = labelFor(q.poolOptions, code);
      if(code==="OTHER" && otherTexts[q.poolFrom]) lbl = "أخرى: " + otherTexts[q.poolFrom];
      return {code:code, label:lbl};
    });
  }
  return q.options || [];
}

/* ---------------------------------------------------------------------
   العرض الرئيسي
--------------------------------------------------------------------- */
var app = document.getElementById("app");
var navbar = document.getElementById("navbar");
var btnPrev = document.getElementById("btnPrev");
var btnNext = document.getElementById("btnNext");
var progressFill = document.getElementById("progressFill");
var stepPill = document.getElementById("stepPill");
var sectionLabel = document.getElementById("sectionLabel");

function updateTopbar(){
  if(screen!=="question"){
    stepPill.textContent = screen==="intro" ? "البداية" : screen==="review" ? "المراجعة" : screen==="done" ? "تم" : "";
    sectionLabel.textContent = "";
    var pct = screen==="intro" ? 0 : screen==="review" ? 96 : screen==="done" ? 100 : 0;
    progressFill.style.width = pct + "%";
    return;
  }
  var list = applicableList();
  var pos = list.indexOf(Q[qIndex]) + 1;
  var total = list.length;
  stepPill.textContent = "سؤال " + pos + " من " + total;
  sectionLabel.textContent = Q[qIndex].section;
  progressFill.style.width = Math.max(4, Math.round((pos/total)*94)) + "%";
}

function render(){
  app.innerHTML = "";
  if(screen==="intro") renderIntro();
  else if(screen==="question") renderQuestion();
  else if(screen==="declined") renderDeclined();
  else if(screen==="review") renderReview();
  else if(screen==="done") renderDone();
  updateTopbar();
  updateNav();
  window.scrollTo({top:0, behavior:"instant" in window ? "instant":"auto"});
}

function updateNav(){
  if(screen==="declined" || screen==="done"){ navbar.hidden = true; return; }
  navbar.hidden = false;
  btnPrev.style.visibility = (screen==="intro") ? "hidden" : "visible";
  if(screen==="review"){
    btnNext.textContent = "إرسال (تجريبي)";
  } else if(screen==="intro"){
    btnNext.textContent = "ابدأ الاستبيان";
  } else {
    var list = applicableList();
    var isLast = list.indexOf(Q[qIndex]) === list.length-1;
    btnNext.textContent = isLast ? "مراجعة الإجابات" : "التالي";
  }
}

/* ---------- شاشة السؤال ---------- */
function renderQuestion(){
  var q = Q[qIndex];
  var box = el("div", {class:"card"});
  var meta = el("div", {class:"q-meta"});
  meta.appendChild(el("span", {class:"q-code"}, [q.id]));
  if(q.required) meta.appendChild(el("span", {class:"q-req"}, ["إلزامي"]));
  else meta.appendChild(el("span", {class:"q-opt-tag"}, ["اختياري"]));
  if(q.type==="multi") meta.appendChild(el("span", {class:"q-opt-tag"}, ["اختيار متعدد — حتى " + q.max]));
  if(q.type==="rank") meta.appendChild(el("span", {class:"q-opt-tag"}, ["ترتيب أولويات"]));
  box.appendChild(meta);

  box.appendChild(el("div", {class:"q-text"}, [q.text]));
  if(q.help) box.appendChild(el("div", {class:"q-help"}, [q.help]));
  if(q.audience && q.audience!=="جميع المشاركين") box.appendChild(el("div", {class:"q-audience"}, ["يظهر لـ: " + q.audience]));

  var body = el("div");
  if(q.type==="single") body.appendChild(renderSingle(q));
  else if(q.type==="multi") body.appendChild(renderMulti(q));
  else if(q.type==="short") body.appendChild(renderText(q,false));
  else if(q.type==="long") body.appendChild(renderText(q,true));
  else if(q.type==="rank") body.appendChild(renderRank(q));
  box.appendChild(body);

  if(lastError) box.appendChild(el("div", {class:"err"}, [lastError]));
  app.appendChild(box);
}

function optionRow(opt, checked, onToggle, inputType, extraBadge){
  var row = el("label", {class:"opt" + (checked?" checked":"")});
  var input = el("input", {type:inputType, onchange:onToggle});
  input.checked = checked;
  row.appendChild(input);
  row.appendChild(el("span", {class:"lbl"}, [opt.label]));
  if(extraBadge) row.appendChild(extraBadge);
  return row;
}

function renderSingle(q){
  var wrap = el("div");
  var opts = el("div", {class:"options"});
  var current = answers[q.varName];
  q.options.forEach(function(opt){
    var checked = current===opt.code;
    opts.appendChild(optionRow(opt, checked, function(){
      answers[q.varName] = opt.code;
      if(!opt.other) delete otherTexts[q.varName];
      lastError=""; render();
    }, "radio"));
  });
  wrap.appendChild(opts);
  var chosen = q.options.filter(function(o){return o.code===current;})[0];
  if(chosen && chosen.other) wrap.appendChild(otherField(q));
  return wrap;
}

function renderMulti(q){
  var wrap = el("div");
  var opts = el("div", {class:"options"});
  var list = optionListForQuestion(q);
  var current = answers[q.varName] || [];
  var atMax = current.length >= q.max;
  list.forEach(function(opt){
    var checked = current.indexOf(opt.code) > -1;
    var disabled = !checked && atMax;
    var row = optionRow(opt, checked, function(){
      var arr = (answers[q.varName]||[]).slice();
      var i = arr.indexOf(opt.code);
      if(i>-1) arr.splice(i,1);
      else { if(arr.length>=q.max) return; arr.push(opt.code); }
      answers[q.varName] = arr;
      if(opt.code==="OTHER" && i>-1) delete otherTexts[q.varName];
      lastError=""; render();
    }, "checkbox");
    if(disabled) row.className += " disabled";
    opts.appendChild(row);
  });
  if(list.length===0) opts.appendChild(el("div", {class:"empty-pool"}, ["لا توجد خيارات متاحة بعد — عد إلى السؤال المرتبط واختر إجابة أولاً."]));
  wrap.appendChild(opts);
  wrap.appendChild(el("div", {class:"limit-note"}, ["تم اختيار " + current.length + " من " + q.max + " كحد أقصى."]));
  var hasOtherChecked = current.indexOf("OTHER")>-1 && !q.poolFrom;
  if(hasOtherChecked) wrap.appendChild(otherField(q));
  return wrap;
}

function renderText(q, isLong){
  var wrap = el("div");
  var val = answers[q.varName] || "";
  var field = isLong ? el("textarea", {oninput:function(e){answers[q.varName]=e.target.value;}})
                      : el("input", {type:"text", oninput:function(e){answers[q.varName]=e.target.value;}});
  field.value = val;
  wrap.appendChild(field);
  return wrap;
}

function otherField(q){
  var wrap = el("div", {class:"other-field"});
  var input = el("input", {type:"text", placeholder:"يرجى التوضيح…", oninput:function(e){otherTexts[q.varName]=e.target.value;}});
  input.value = otherTexts[q.varName] || "";
  wrap.appendChild(input);
  return wrap;
}

function renderRank(q){
  var wrap = el("div");
  var pool = optionListForQuestion(q);
  if(pool.length===0){
    wrap.appendChild(el("div", {class:"empty-pool"}, ["لا توجد اختيارات لترتيبها — عد إلى السؤال السابق واختر إجابة واحدة على الأقل."]));
    return wrap;
  }
  var maxRank = Math.min(q.max, pool.length);
  var current = answers[q.varName] || [];
  var opts = el("div", {class:"options"});
  pool.forEach(function(opt){
    var rankPos = current.indexOf(opt.code);
    var checked = rankPos>-1;
    var badge = checked ? el("span", {class:"rank-badge"}, [String(rankPos+1)]) : null;
    var row = optionRow(opt, checked, function(){
      var arr = current.slice();
      var i = arr.indexOf(opt.code);
      if(i>-1) arr.splice(i,1);
      else { if(arr.length>=maxRank) return; arr.push(opt.code); }
      answers[q.varName] = arr;
      lastError=""; render();
    }, "checkbox", badge);
    if(!checked && current.length>=maxRank) row.className += " disabled";
    opts.appendChild(row);
  });
  wrap.appendChild(opts);
  wrap.appendChild(el("div", {class:"limit-note"}, ["انقر على العناصر بترتيب الأولوية (١ فأعلى). المطلوب ترتيب " + maxRank + " من أصل " + pool.length + "."]));
  return wrap;
}

/* ---------------------------------------------------------------------
   التحقق
--------------------------------------------------------------------- */
function validateCurrent(){
  var q = Q[qIndex];
  var v = answers[q.varName];
  if(q.type==="single"){
    if(q.required && !v) return "هذا السؤال إلزامي، يرجى اختيار إجابة.";
    var chosen = q.options && q.options.filter(function(o){return o.code===v;})[0];
    if(chosen && chosen.other && !(otherTexts[q.varName]||"").trim()) return "يرجى كتابة توضيح مختصر عند اختيار «أخرى».";
  } else if(q.type==="multi"){
    var arr = v||[];
    if(q.required && arr.length===0) return "هذا السؤال إلزامي، يرجى اختيار خيار واحد على الأقل.";
    if(arr.length>q.max) return "لا يمكن اختيار أكثر من " + q.max + " خيارات.";
    if(arr.indexOf("OTHER")>-1 && !q.poolFrom && !(otherTexts[q.varName]||"").trim()) return "يرجى كتابة توضيح مختصر عند اختيار «أخرى».";
  } else if(q.type==="rank"){
    var pool = optionListForQuestion(q);
    var maxRank = Math.min(q.max, pool.length);
    var arr2 = v||[];
    if(q.required && pool.length>0 && arr2.length<maxRank) return "يرجى ترتيب " + maxRank + " عناصر على الأقل.";
  } else if(q.type==="short" || q.type==="long"){
    if(q.required && !(v||"").trim()) return "هذا السؤال إلزامي، يرجى كتابة إجابة.";
  }
  return "";
}

/* ---------------------------------------------------------------------
   التنقّل
--------------------------------------------------------------------- */
btnNext.addEventListener("click", function(){
  if(screen==="intro"){
    qIndex = firstApplicableFrom(0,1);
    screen="question"; lastError=""; render(); return;
  }
  if(screen==="question"){
    var err = validateCurrent();
    if(err){ lastError = err; render(); return; }
    if(Q[qIndex].id==="A01" && answers.consent==="B"){ screen="declined"; lastError=""; render(); return; }
    var next = firstApplicableFrom(qIndex+1,1);
    if(next>=Q.length){ screen="review"; lastError=""; render(); }
    else { qIndex = next; lastError=""; render(); }
    return;
  }
  if(screen==="review"){
    screen="done"; lastError=""; render();
    submitResponse(buildExportObject());
    return;
  }
});

btnPrev.addEventListener("click", function(){
  if(screen==="question"){
    var prev = firstApplicableFrom(qIndex-1,-1);
    if(prev<0){ screen="intro"; lastError=""; render(); }
    else { qIndex=prev; lastError=""; render(); }
    return;
  }
  if(screen==="review"){
    qIndex = firstApplicableFrom(Q.length-1,-1);
    screen="question"; lastError=""; render(); return;
  }
});

function jumpToQuestion(id){
  var i = Q.map(function(q){return q.id;}).indexOf(id);
  if(i>-1){ qIndex=i; screen="question"; lastError=""; render(); }
}

function resetAll(){
  answers = {}; otherTexts = {}; qIndex = 0; screen = "intro"; lastError="";
  submitState = "idle"; hasSubmitted = false;
  render();
}

/* ---------------------------------------------------------------------
   شاشة المراجعة
--------------------------------------------------------------------- */
function formatAnswer(q){
  var v = answers[q.varName];
  if(q.type==="single"){
    if(!v) return null;
    var opt = (q.options||[]).filter(function(o){return o.code===v;})[0];
    var lbl = opt?opt.label:v;
    if(opt && opt.other && otherTexts[q.varName]) lbl += "（" + otherTexts[q.varName] + "）";
    return lbl;
  }
  if(q.type==="multi"){
    var arr = v||[];
    if(arr.length===0) return null;
    var list = optionListForQuestion(q);
    var labels = arr.map(function(c){
      var o = list.filter(function(x){return x.code===c;})[0];
      var l = o?o.label:c;
      if(c==="OTHER" && otherTexts[q.varName] && !q.poolFrom) l += "（" + otherTexts[q.varName] + "）";
      return l;
    });
    return labels.join("، ");
  }
  if(q.type==="rank"){
    var arr2 = v||[];
    if(arr2.length===0) return null;
    var pool = optionListForQuestion(q);
    return arr2.map(function(c,idx){
      var o = pool.filter(function(x){return x.code===c;})[0];
      return (idx+1) + ") " + (o?o.label:c);
    }).join("  ·  ");
  }
  if(q.type==="short" || q.type==="long"){
    return (v||"").trim() || null;
  }
  return null;
}

function renderReview(){
  var box = el("div", {class:"card"});
  box.appendChild(el("h2", {}, ["مراجعة الإجابات"]));
  box.appendChild(el("p", {class:"q-help", style:"margin-top:6px"}, ["تحقق من إجاباتك قبل الإرسال. يمكنك الضغط على «تعديل» للعودة إلى أي سؤال."]));

  var currentSection = null;
  applicableList().forEach(function(q){
    if(q.section !== currentSection){
      currentSection = q.section;
      box.appendChild(el("div", {class:"section-divider"}, [currentSection]));
    }
    var ans = formatAnswer(q);
    var item = el("div", {class:"rev-item"});
    var head = el("div", {class:"rev-head"});
    head.appendChild(el("div", {class:"rev-q"}, ["[" + q.id + "] " + q.text]));
    head.appendChild(el("button", {class:"rev-edit", onclick:function(){ jumpToQuestion(q.id); }}, ["تعديل"]));
    item.appendChild(head);
    item.appendChild(el("div", {class:"rev-ans" + (ans?"":" empty")}, [ans || "بدون إجابة"]));
    box.appendChild(item);
  });

  app.appendChild(box);
}

/* ---------------------------------------------------------------------
   بناء بيانات التصدير
--------------------------------------------------------------------- */
/* أسئلة تحتوي خيار "أخرى" فعلي (غير معتمد على تجميع سؤال سابق) — تُعطى
   عمود "_other_text" ثابتاً دائماً حتى يبقى رأس الجدول منتظماً لكل المشاركين. */
var QUESTIONS_WITH_OTHER = Q.filter(function(q){
  return !q.poolFrom && q.options && q.options.some(function(o){return o.other;});
}).map(function(q){ return q.varName; });

/* يبني كائن الإجابة الكامل: كل الأسئلة الأربعين بأسماء متغيرات ثابتة دائماً،
   بقيمة فارغة لما لم يظهر لهذا المشارك (شرط ظهور لم يتحقق)، حتى يبقى
   عدد وترتيب الأعمدة ثابتاً في كل صف يصل إلى الجدول. */
function buildExportObject(){
  var applicableIds = applicableList().map(function(q){return q.id;});
  var out = {
    submitted_at: new Date().toISOString(),
    form: "survey_common_part_v0",
    applicable_questions: applicableIds.join("|")
  };
  Q.forEach(function(q){
    var shown = applicableIds.indexOf(q.id) > -1;
    var val = shown && answers[q.varName] !== undefined ? answers[q.varName] : (q.type==="multi"||q.type==="rank" ? [] : "");
    out[q.varName] = val;
  });
  QUESTIONS_WITH_OTHER.forEach(function(varName){
    out[varName + "_other_text"] = otherTexts[varName] || "";
  });
  return out;
}

function toCsvValue(v){
  if(Array.isArray(v)) v = v.join("|");
  v = String(v===undefined||v===null?"":v);
  if(/[",\n]/.test(v)) v = '"' + v.replace(/"/g,'""') + '"';
  return v;
}

function buildCsv(obj){
  var keys = Object.keys(obj).filter(function(k){return k!=="meta";});
  var header = keys.join(",");
  var row = keys.map(function(k){return toCsvValue(obj[k]);}).join(",");
  return header + "\n" + row;
}

var downloadsCap = null;
if(window.claude && typeof window.claude.use === "function"){
  window.claude.use("downloads").then(function(d){ downloadsCap = d; }).catch(function(){ downloadsCap = null; });
}

function download(filename, content, mime, btn){
  var blob = new Blob([content], {type:mime});
  if(downloadsCap){
    var prevLabel = btn ? btn.textContent : null;
    if(btn){ btn.disabled = true; btn.textContent = "جارٍ التنزيل…"; }
    downloadsCap.save({filename:filename, data:blob}).then(function(){
      if(btn){ btn.disabled = false; btn.textContent = prevLabel; }
    }).catch(function(err){
      if(btn){ btn.disabled = false; btn.textContent = prevLabel; }
      if(err && err.code==="declined") return;
      showDownloadFallback(filename, content, mime);
    });
    return;
  }
  showDownloadFallback(filename, content, mime);
}

function showDownloadFallback(filename, content, mime){
  var win = window.open("", "_blank");
  if(win && win.document){
    win.document.title = filename;
    var pre = win.document.createElement("pre");
    pre.style.whiteSpace = "pre-wrap";
    pre.style.direction = "ltr";
    pre.style.textAlign = "left";
    pre.style.fontFamily = "ui-monospace,Menlo,Consolas,monospace";
    pre.style.padding = "16px";
    pre.textContent = content;
    win.document.body.appendChild(pre);
  } else {
    alert("تعذّر حفظ الملف تلقائياً في هذه البيئة. المحتوى معروض في معاينة JSON أدناه لنسخه يدوياً.");
  }
}

/* ---------------------------------------------------------------------
   شاشة الانتهاء
--------------------------------------------------------------------- */
function renderDone(){
  var box = el("div", {class:"card hero"});

  if(submitState==="sending"){
    box.appendChild(el("div", {class:"done-icon", style:"background:var(--surface-2);color:var(--text-muted)"}, ["…"]));
    box.appendChild(el("h1", {}, ["جارٍ إرسال إجابتك…"]));
    box.appendChild(el("p", {}, ["يرجى الانتظار لحظة."]));
  } else if(submitState==="sent"){
    box.appendChild(el("div", {class:"done-icon"}, ["✓"]));
    box.appendChild(el("h1", {}, ["تم إرسال إجابتك"]));
    box.appendChild(el("p", {}, ["شكراً لمشاركتك. تم إرسال إجاباتك لتُحفظ ضمن إجابات الاستبيان."]));
    box.appendChild(el("div", {class:"notice"}, [
      el("b", {}, ["ملاحظة: "]), "لأسباب تقنية في المتصفح لا يمكن للصفحة تأكيد استلام الخادم للبيانات بنسبة قطعية. يمكنك أيضاً تنزيل نسخة من إجابتك أدناه للاحتفاظ بها."
    ]));
  } else if(submitState==="failed"){
    box.appendChild(el("div", {class:"done-icon", style:"background:var(--danger-tint);color:var(--danger)"}, ["!"]));
    box.appendChild(el("h1", {}, ["تعذّر إرسال الإجابة تلقائياً"]));
    box.appendChild(el("p", {}, ["حدث خطأ في الاتصال أثناء الإرسال. يرجى تنزيل نسخة من إجابتك أدناه وإرسالها يدوياً، أو إعادة المحاولة لاحقاً."]));
  } else {
    box.appendChild(el("div", {class:"done-icon"}, ["✓"]));
    box.appendChild(el("h1", {}, ["تم إنهاء الاستبيان"]));
  }

  var obj = buildExportObject();
  var exportRow = el("div", {class:"export-row"});
  var jsonBtn = el("button", {class:"btn btn-accent"}, ["⭳ تصدير JSON"]);
  jsonBtn.addEventListener("click", function(){
    download("trial-response.json", JSON.stringify(obj, null, 2), "application/json", jsonBtn);
  });
  var csvBtn = el("button", {class:"btn btn-ghost"}, ["⭳ تصدير CSV"]);
  csvBtn.addEventListener("click", function(){
    download("trial-response.csv", buildCsv(obj), "text/csv;charset=utf-8", csvBtn);
  });
  exportRow.appendChild(jsonBtn);
  exportRow.appendChild(csvBtn);
  box.appendChild(exportRow);

  box.appendChild(el("div", {style:"margin-top:16px"}, [el("div",{class:"q-help",style:"margin-bottom:6px"},["معاينة JSON:"])]));
  box.appendChild(el("pre", {class:"data-preview"}, [JSON.stringify(obj, null, 2)]));

  box.appendChild(el("button", {class:"btn btn-ghost btn-block", style:"margin-top:16px", onclick:resetAll}, ["بدء تعبئة جديدة"]));
  app.appendChild(box);
}
